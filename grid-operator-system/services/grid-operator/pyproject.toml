[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-operator"
version = "0.1.0"
description = "Durable CL8Y grid indexer and keeper"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
quality = [
    "build==1.3.0",
    "coverage==7.10.4",
    "mypy==1.17.1",
    "ruff==0.12.10",
]

[project.scripts]
grid-operator = "grid_operator.cli:main"

[tool.setuptools]
packages = ["grid_operator"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "*.egg-info"]

[tool.mypy]
python_version = "3.10"
files = [
    "grid_operator/keeper.py",
    "grid_operator/swap_keeper.py",
    "grid_operator/reliability.py",
]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = [
    "grid_operator.keeper",
    "grid_operator.swap_keeper",
    "grid_operator.reliability",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
