[workspace]
resolver = "2"
members = [
  "packages/cl8y-dex",
  "packages/bot-types",
  "contracts/swap-proxy",
  "contracts/bot-vault",
  "contracts/bot-liquidity",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
cosmwasm-schema = "1.5.9"
cosmwasm-std = "1.5.11"
cw-storage-plus = "3.0.1"
cw2 = "1.1.2"
cw20 = "1.1.2"
cw20-base = { version = "1.1.2", features = ["library"] }
cw-multi-test = "1.2.0"
schemars = "0.8.15"
serde = { version = "1.0.188", default-features = false, features = ["derive"] }
thiserror = "1.0.4"
base64ct = "=1.7.3"
zeroize = "=1.8.1"

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 3
overflow-checks = true
