[package]
name = "cl8y-bot-vault"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
# Production-lock feature (off by default). When enabled, the vault's
# `fee_collector` and `proxy` are verified against the canonical mainnet
# addresses below: instantiate REJECTS a non-canonical value and the update
# messages refuse to re-point them. Builds require the canonical collector and
# proxy through CL8Y_CANONICAL_FEE_COLLECTOR and CL8Y_CANONICAL_SWAP_PROXY.
mainnet = []

[dependencies]
bot-types = { path = "../../packages/bot-types", version = "0.2.0" }
cl8y-dex = { path = "../../packages/cl8y-dex", version = "0.2.0" }
base64ct.workspace = true
cosmwasm-schema.workspace = true
cosmwasm-std.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
cw20.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
cw-multi-test = "1.2.0"
cw20-base = { version = "1.1.2", features = ["library"] }
cl8y-fee-registry = { path = "../../../fee-system/contracts/fee-registry", version = "0.2.0" }
cl8y-bot-liquidity = { path = "../bot-liquidity", version = "0.2.0" }
cl8y-swap-proxy = { path = "../swap-proxy", version = "0.2.0" }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
