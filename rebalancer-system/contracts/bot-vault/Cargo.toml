[package]
name = "cl8y-bot-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
# Production-lock feature (off by default). When enabled, the vault's
# `fee_collector` and `proxy` are verified against the canonical mainnet
# addresses below: instantiate REJECTS a non-canonical value and the update
# messages refuse to re-point them. Canonical constants are `None` until the
# fee-collector and swap-proxy are deployed on mainnet, then filled in here.
mainnet = []

[dependencies]
bot-types = { path = "../../packages/bot-types", version = "0.1.0" }
cl8y-dex = { path = "../../packages/cl8y-dex", version = "0.1.0" }
base64ct.workspace = true
cosmwasm-schema.workspace = true
cosmwasm-std.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
cw20.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
cw-multi-test = "1.2.0"
cw20-base = { version = "1.1.2", features = ["library"] }
cl8y-fee-registry = { path = "../../../fee-system/contracts/fee-registry" }
