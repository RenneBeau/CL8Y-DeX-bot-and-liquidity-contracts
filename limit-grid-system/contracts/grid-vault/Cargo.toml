[package]
name = "cl8y-grid-vault"
version = "0.1.1"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
# Production-lock feature (off by default). When enabled, the vault's
# `fee_collector` is verified against the canonical mainnet address in
# `src/mainnet.rs`: instantiate REJECTS non-canonical values. (This vault has
# no proxy field; the protocol fee goes straight to the fee-collector.) The
# canonical constant is `None` until the fee-collector is deployed to mainnet.
mainnet = []

[dependencies]
cosmwasm-schema.workspace = true
cosmwasm-std.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
cw20.workspace = true
thiserror.workspace = true
semver.workspace = true
base64ct.workspace = true
zeroize.workspace = true
cl8y-grid-manager = { path = "../grid-manager", version = "0.1.0", features = ["library"] }

[dev-dependencies]
cw-multi-test = "1.2.0"
cw20-base = "1.1.2"
cl8y-fee-registry = { path = "../../../fee-system/contracts/fee-registry" }
