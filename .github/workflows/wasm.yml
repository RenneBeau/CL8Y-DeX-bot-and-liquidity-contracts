name: Reproducible Wasm

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPTIMIZER_IMAGE: cosmwasm/workspace-optimizer:0.16.1@sha256:b9c92b2900b7ebaab3499203615c1b8589592bc557355ed3432e48851ffde69e
  CL8Y_CANONICAL_FEE_COLLECTOR: terra1x46rqay4d3cssq8gxxvqz8xt6nwlz4td20k38v
  CL8Y_CANONICAL_FEE_REGISTRY: terra1mpys68uwajmcjn6lwctan39v5sf4yk3agxp8pns02kqfnym3racsunwpqy
  CL8Y_CANONICAL_SWAP_PROXY: terra16j5u6ey7a84g40sr3gd94nzg5w5fm45046k9s2347qhfpwm5fr6sem3lr2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build each workspace twice
        run: |
          mkdir -p evidence artifacts/release
          .github/scripts/release-security-policy.sh inventory
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          for workspace in $(.github/scripts/release-security-policy.sh workspaces); do
            .github/scripts/reproducible-build.sh "$workspace" artifacts/release default \
              2>&1 | tee "evidence/$workspace-default-build.log"
            .github/scripts/reproducible-build.sh "$workspace" artifacts/release mainnet \
              2>&1 | tee "evidence/$workspace-mainnet-build.log"
          done
          (cd artifacts/release && sha256sum -- *.wasm | LC_ALL=C sort) | tee evidence/checksums.txt
      - name: Upload optimized Wasm
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optimized-wasm-${{ github.sha }}
          path: artifacts/release/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
