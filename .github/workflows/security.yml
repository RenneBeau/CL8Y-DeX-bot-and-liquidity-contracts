name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTSEC_REV: 3889e79597f5a8f42b6b8c2fe2db521d0f255991
  CARGO_DENY_REV: bca0dde53651ee946720e4540b5ce2610bec8f06

jobs:
  audit-and-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release and advisory policy
        run: .github/scripts/tests/release-security-policy-test.sh
      - name: Install pinned scanners
        run: |
          mkdir -p evidence
          .github/scripts/install-security-tools.sh
          echo "$RUSTSEC_REV" | tee evidence/rustsec-revision.txt
          echo "$CARGO_DENY_REV" | tee evidence/cargo-deny-revision.txt
          cargo +stable audit --version | tee evidence/cargo-audit-version.txt
          cargo +stable deny --version | tee evidence/cargo-deny-version.txt
      - name: Scan workspaces
        env:
          AUDIT_EVIDENCE_DIR: evidence
        run: |
          mkdir -p evidence
          status=0
          .github/scripts/release-security-policy.sh audit || status=1
          for workspace in $(.github/scripts/release-security-policy.sh workspaces); do
            cargo +stable deny --manifest-path "$workspace/Cargo.toml" --all-features check \
              2>&1 | tee "evidence/$workspace-deny.log" || status=1
          done
          exit "$status"
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-security-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
