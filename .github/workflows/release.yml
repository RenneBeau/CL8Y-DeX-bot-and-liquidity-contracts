name: Signed release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GH_TOKEN: ${{ github.token }}
  OPTIMIZER_IMAGE: cosmwasm/workspace-optimizer:0.16.1@sha256:b9c92b2900b7ebaab3499203615c1b8589592bc557355ed3432e48851ffde69e

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require an annotated, verified tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          test "$(jq -r '.object.type' <<<"$ref")" = tag
          tag_sha=$(jq -r '.object.sha' <<<"$ref")
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
          test "$(jq -r '.verification.verified' <<<"$tag")" = true
          test "$(jq -r '.object.sha' <<<"$tag")" = "$GITHUB_SHA"
          jq '.verification' <<<"$tag" | tee tag-verification.json
      - name: Build reproducible release artifacts
        run: |
          mkdir -p release evidence
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          .github/scripts/reproducible-build.sh rebalancer-system release 2>&1 | tee evidence/rebalancer-build.log
          .github/scripts/reproducible-build.sh grid-contract-system release 2>&1 | tee evidence/grid-build.log
      - name: Generate SBOM
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest release subjects
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release/*.wasm
            release/sbom.spdx.json
      - name: Assemble checksums and provenance
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" release/provenance.sigstore.json
          cp tag-verification.json release/tag-verification.json
          (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum) >release/SHA256SUMS
      - name: Publish GitHub release
        env:
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            evidence/
            release/
            tag-verification.json
          retention-days: 90
          if-no-files-found: warn
