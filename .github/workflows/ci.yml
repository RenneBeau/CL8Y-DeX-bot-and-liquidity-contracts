name: Source quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace: [rebalancer-system, grid-contract-system]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record toolchain
        run: |
          mkdir -p evidence
          rustc --version --verbose | tee evidence/rustc.txt
          cargo --version | tee evidence/cargo.txt
      - name: Check formatting
        run: cargo fmt --manifest-path "${{ matrix.workspace }}/Cargo.toml" --all -- --check 2>&1 | tee evidence/fmt.log
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path "${{ matrix.workspace }}/Cargo.toml" --all-targets -- -D warnings 2>&1 | tee evidence/clippy.log
      - name: Run tests
        run: cargo test --locked --manifest-path "${{ matrix.workspace }}/Cargo.toml" --all-targets 2>&1 | tee evidence/test.log
      - name: Upload Rust evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-quality-${{ matrix.workspace }}-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn

  python-and-operators:
    name: Keeper and operator tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test keeper
        run: |
          mkdir -p evidence
          python -m unittest discover -v -s rebalancer-system/examples/keeper -p 'test_*.py' 2>&1 | tee evidence/keeper.log
      - name: Test grid operator
        run: |
          python -m unittest discover -v -s grid-contract-system/services/grid-operator/tests -p 'test_*.py' 2>&1 | tee evidence/grid-operator.log
      - name: Validate operator shell
        run: |
          for script in test-area/*.sh rebalancer-system/examples/keeper/*.sh; do
            bash -n "$script"
          done 2>&1 | tee evidence/operator-shell.log
      - name: Validate Compose configuration
        run: docker compose -f test-area/docker-compose.override.yml config --no-interpolate 2>&1 | tee evidence/compose.log
      - name: Upload operator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keeper-operator-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
