name: Source quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CL8Y_CANONICAL_FEE_COLLECTOR: terra1x46rqay4d3cssq8gxxvqz8xt6nwlz4td20k38v
  CL8Y_CANONICAL_FEE_REGISTRY: terra1mpys68uwajmcjn6lwctan39v5sf4yk3agxp8pns02kqfnym3racsunwpqy
  CL8Y_CANONICAL_SWAP_PROXY: terra16j5u6ey7a84g40sr3gd94nzg5w5fm45046k9s2347qhfpwm5fr6sem3lr2

jobs:
  rust:
    name: Rust (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace: [rebalancer-system, market-grid-system, limit-grid-system, fee-system]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.81.0 --profile minimal && rustup default 1.81.0
      - name: Record toolchain
        run: |
          mkdir -p evidence
          rustc --version --verbose | tee evidence/rustc.txt
          cargo --version | tee evidence/cargo.txt
      - name: Check formatting
        run: cargo fmt --manifest-path "${{ matrix.workspace }}/Cargo.toml" --all -- --check 2>&1 | tee evidence/fmt.log
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path "${{ matrix.workspace }}/Cargo.toml" --all-targets -- -D warnings 2>&1 | tee evidence/clippy.log
      - name: Run tests
        run: cargo test --locked --manifest-path "${{ matrix.workspace }}/Cargo.toml" --all-targets 2>&1 | tee evidence/test.log
      - name: Gate mainnet feature
        run: |
          if [ "${{ matrix.workspace }}" = fee-system ]; then
            targets=--all-targets
          else
            targets=--lib
          fi
          cargo test --locked --manifest-path "${{ matrix.workspace }}/Cargo.toml" \
            "$targets" --features mainnet 2>&1 | tee evidence/mainnet-test.log
      - name: Upload Rust evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-quality-${{ matrix.workspace }}-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn

  python-and-operators:
    name: Python quality (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rebalancer-keeper
            package: rebalancer-system/examples/keeper
            tests: rebalancer-system/examples/keeper/test_keeper.py
            module: keeper
            coverage_file: .coverage-rebalancer
          - name: grid-operator
            package: grid-operator-system/services/grid-operator
            tests: grid-operator-system/services/grid-operator/tests
            module: grid_operator
            coverage_file: .coverage-grid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Create isolated package environment
        run: |
          mkdir -p evidence
          python -m venv "$RUNNER_TEMP/${{ matrix.name }}"
          "$RUNNER_TEMP/${{ matrix.name }}/bin/python" -m pip install \
            "./${{ matrix.package }}[quality]" 2>&1 | tee "evidence/${{ matrix.name }}-install.log"
          "$RUNNER_TEMP/${{ matrix.name }}/bin/python" -m pip freeze \
            | tee "evidence/${{ matrix.name }}-versions.txt"
      - name: Validate package build
        run: |
          "$RUNNER_TEMP/${{ matrix.name }}/bin/python" -m build \
            --outdir "$RUNNER_TEMP/${{ matrix.name }}-dist" "${{ matrix.package }}" \
            2>&1 | tee "evidence/${{ matrix.name }}-build.log"
      - name: Run Ruff
        run: |
          "$RUNNER_TEMP/${{ matrix.name }}/bin/ruff" check \
            --config "${{ matrix.package }}/pyproject.toml" "${{ matrix.package }}" \
            2>&1 | tee "evidence/${{ matrix.name }}-ruff.log"
      - name: Run MyPy transaction and recovery gate
        run: |
          if [ "${{ matrix.name }}" = rebalancer-keeper ]; then
            targets=("${{ matrix.package }}/keeper.py")
          else
            targets=(
              "${{ matrix.package }}/grid_operator/keeper.py"
              "${{ matrix.package }}/grid_operator/swap_keeper.py"
              "${{ matrix.package }}/grid_operator/reliability.py"
            )
          fi
          "$RUNNER_TEMP/${{ matrix.name }}/bin/mypy" \
            --config-file "${{ matrix.package }}/pyproject.toml" "${targets[@]}" \
            2>&1 | tee "evidence/${{ matrix.name }}-mypy.log"
      - name: Test installed package with branch coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/${{ matrix.coverage_file }}
        run: |
          if [ "${{ matrix.name }}" = rebalancer-keeper ]; then
            test_root="$RUNNER_TEMP/rebalancer-tests"
            mkdir -p "$test_root"
            cp "${{ matrix.tests }}" "$test_root/test_keeper.py"
          else
            test_root="$GITHUB_WORKSPACE/${{ matrix.tests }}"
          fi
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/${{ matrix.name }}/bin/python" -c \
            "import ${{ matrix.module }} as package; print(package.__file__)" \
            | tee "$GITHUB_WORKSPACE/evidence/${{ matrix.name }}-import.txt"
          "$RUNNER_TEMP/${{ matrix.name }}/bin/coverage" run \
            --rcfile "$GITHUB_WORKSPACE/${{ matrix.package }}/pyproject.toml" \
            -m unittest discover -v -s "$test_root" -p 'test_*.py' \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/${{ matrix.name }}-tests.log"
          "$RUNNER_TEMP/${{ matrix.name }}/bin/coverage" report \
            --rcfile "$GITHUB_WORKSPACE/${{ matrix.package }}/pyproject.toml" \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/${{ matrix.name }}-coverage.log"
      - name: Validate operator shell
        run: |
          for script in test-area/*.sh rebalancer-system/examples/keeper/*.sh; do
            bash -n "$script"
          done 2>&1 | tee evidence/operator-shell.log
      - name: Validate Compose configuration
        run: docker compose -f test-area/docker-compose.override.yml config --no-interpolate 2>&1 | tee evidence/compose.log
      - name: Upload operator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keeper-operator-${{ matrix.name }}-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run pinned ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" \
            koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            --exclude=SC1091,SC2034,SC2086 .github/scripts/*.sh test-area/*.sh
