[package]
name = "cl8y-fee-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
## Enables the production lock: `cl8y` and `treasury` are pinned to the
## canonical mainnet addresses compiled below and can never be re-pointed.
## Use for reproducibility of the mainnet artifact only (`cargo build --release
## --target wasm32-unknown-unknown --features mainnet`); leave off for local
## test-a-net / E2E deployments which use dummy addresses.
mainnet = []

[dependencies]
cosmwasm-schema.workspace = true
cosmwasm-std.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
cw20.workspace = true
thiserror.workspace = true
semver.workspace = true

[dev-dependencies]
cw-multi-test = "1.2.0"
cw20-base = "1.1.2"
assert_matches = "1.5.0"
serde = "1.0"
