[package]
name = "cl8y-grid-vault-swap"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
# Production-lock feature (off by default). When enabled, the vault's
# `fee_collector` and `proxy` are verified against the canonical mainnet
# addresses in `src/mainnet.rs`: instantiate REJECTS non-canonical values and
# `update_config` refuses to re-point them. Canonical constants are `None`
# until the fee-collector and swap-proxy are deployed to mainnet.
mainnet = []

[dependencies]
cosmwasm-schema.workspace = true
cosmwasm-std.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
cw20.workspace = true
thiserror.workspace = true
serde.workspace = true
base64ct.workspace = true
zeroize.workspace = true

[dev-dependencies]
cw-multi-test = "1.2.0"
cw20-base = { version = "1.1.2", features = ["library"] }
cl8y-fee-registry = { path = "../../../fee-system/contracts/fee-registry" }
